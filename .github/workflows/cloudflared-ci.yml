name: Cloudflared native verification

on:
  push:
    branches: [feat/local-cloudflare-tunnels]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflared-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s build/ci -p 'test_*.py' -v
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site exec tsc -b
      - run: pnpm --dir site run test
      - run: pnpm --dir site exec eslint src/pages/Tunnels src/test src/App.tsx src/layouts/MainLayout.tsx vitest.config.ts
      - run: pnpm --dir site run build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflared-frontend
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native ${{ matrix.os }}-${{ matrix.arch }}
    needs: frontend
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cloudflared-frontend
          path: pb_public/
      - name: Assert native host and record provenance
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ci-results
          python build/ci/native_environment.py > ci-results/environment.json
      - name: Discover Windows CGO compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($candidate in @('C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin', 'C:\mingw64\bin')) {
            if (Test-Path "$candidate\gcc.exe") { Add-Content $env:GITHUB_PATH $candidate; break }
          }
      - name: Race availability (explicitly record unsupported environments)
        id: race
        run: |
          if command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Race: scheduled; CGO compiler found.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Race: Skipped — no supported CGO compiler found on this runner.' | tee ci-results/race-skipped.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Vet and native build
        id: build
        run: |
          go vet ./...
          go build ./...
      - name: Native unit, runner, credential, API and migration tests
        id: unit
        run: go test -json -count=1 -timeout 12m ./... > ci-results/unit.json
      - name: Native race tests
        id: race_test
        if: success() && steps.race.outputs.enabled == 'true'
        env:
          CGO_ENABLED: '1'
        run: go test -race -json -count=1 -timeout 12m ./... > ci-results/race.json
      - name: Download pinned official binary and check SHA-256
        id: download
        run: python build/ci/download_cloudflared.py --output "$RUNNER_TEMP/cloudflared-official" > ci-results/official-binary.json
      - name: Official binary local-failure verification (no Edge credentials)
        id: official
        run: |
          export PODUX_TEST_CLOUDFLARED="$(python -c 'import json; print(json.load(open("ci-results/official-binary.json"))["binary"])')"
          go test -json -count=1 -timeout 3m ./internal/infrastructure/cloudflared -run '^TestOfficialBinary$' > ci-results/official-test.json
      - name: Build isolated FRPS at the unchanged embedded version
        run: python build/ci/build_frps.py --output "$RUNNER_TEMP/frps-test" > ci-results/frps-binary.json
      - name: Native FRPC and test child coexistence
        id: frpc
        run: |
          export PODUX_TEST_FRPS="$(python -c 'import json; print(json.load(open("ci-results/frps-binary.json"))["binary"])')"
          if [ '${{ steps.race.outputs.enabled }}' = 'true' ]; then
            CGO_ENABLED=1 go test -race -json -count=1 -timeout 3m ./internal/integration -run '^TestFRPC' > ci-results/frpc.json
          else
            go test -json -count=1 -timeout 3m ./internal/integration -run '^TestFRPC' > ci-results/frpc.json
          fi
      - name: Record actual outcomes
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          RACE: ${{ steps.race_test.outcome }}
          OFFICIAL: ${{ steps.official.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          FRPC: ${{ steps.frpc.outcome }}
        run: python build/ci/summarize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflared-native-${{ matrix.os }}-${{ matrix.arch }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 14
